services:
  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@host.docker.internal:5432/${POSTGRES_DB:-finance}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional — no :? guard: the app boots fully without the assistant.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    healthcheck:
      # Boot runs alembic upgrade + seed before uvicorn listens; start_period
      # covers that window. A failed migration keeps the service unhealthy, so
      # a redeploy fails visibly instead of silently 502ing behind nginx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      args:
        # Stamps the deployed commit into the bundle so the sidebar footer names the build a
        # bug report came from. Unset → "dev": a plain `up -d --build` still works.
        BUILD_HASH: ${BUILD_HASH:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/finance:/etc/ssl/finance:ro
