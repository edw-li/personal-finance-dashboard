# The calendar feed's credential rides in the query string
# (/api/v1/calendar/feed.ics?token=...), so the stock `combined` format would write it
# into the access log on every poll. $uri is the path AFTER rewriting and carries no
# query at all -- $request, $request_uri and $args would each leak the token. Valid
# here because conf.d/*.conf is included inside nginx's http context.
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Compression (2026-09-23 spec §P2). Static files are compressed ONCE, at image build: the
# Dockerfile writes foo.js.gz beside every text asset of at least 1 KiB and gzip_static serves
# it, so the 2 vCPU box never gzips a file per request. `gzip` itself compresses what is left
# -- API JSON (~30 KB per Overview call) -- at level 5. text/event-stream is deliberately NOT
# listed: the assistant's SSE must reach the browser event by event (the backend also sends
# X-Accel-Buffering: no), and a compressing filter buffers. ZIP downloads are compressed
# already. No brotli: the stock nginx:alpine image has no brotli module, and a custom nginx
# build is not worth the risk. gzip_vary keeps Cloudflare from handing a gzip body to a client
# that did not ask for one; gzip_proxied any also compresses requests a proxy forwarded.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml
           text/plain text/calendar application/manifest+json;
gzip_static on;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log no_query;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # One multiplexed connection for the Overview's ~20 calls instead of HTTP/1.1's six
    # sockets (spec §P2). `http2 on;` is the nginx >= 1.25.1 form; the image is 1.25.
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log no_query;

    # Works with either cert source (see README): a self-signed pair (IP-only
    # access, the default) or a Cloudflare origin pair (optional domain mode).
    ssl_certificate /etc/ssl/finance/cert.pem;
    ssl_certificate_key /etc/ssl/finance/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend container IP via Docker's embedded DNS instead of
    # pinning it at config load — otherwise a backend-only redeploy leaves nginx
    # proxying the old IP and every API call 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must never be cached: a stale index.html references hashed
    # asset filenames that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ^~ so /api/ always outranks the asset-extension regex below — an endpoint
    # path ending in .png/.js/etc. must be proxied, not 404 off the filesystem.
    location ^~ /api/ {
        client_max_body_size 20m;
        # NO trailing slash / URI part on proxy_pass — it must preserve the full
        # /api/v1/... path. "Tidying" this to add one strips /api/ and breaks
        # every call. The variable indirection is what forces DNS re-resolution.
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
