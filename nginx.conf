server {
    listen 80;
    server_name finance.YOUR-DOMAIN.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name finance.YOUR-DOMAIN.com;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend container IP via Docker's embedded DNS instead of
    # pinning it at config load — otherwise a backend-only redeploy leaves nginx
    # proxying the old IP and every API call 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must never be cached: a stale index.html references hashed
    # asset filenames that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ^~ so /api/ always outranks the asset-extension regex below — an endpoint
    # path ending in .png/.js/etc. must be proxied, not 404 off the filesystem.
    location ^~ /api/ {
        client_max_body_size 20m;
        # NO trailing slash / URI part on proxy_pass — it must preserve the full
        # /api/v1/... path. "Tidying" this to add one strips /api/ and breaks
        # every call. The variable indirection is what forces DNS re-resolution.
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
